[project]
name = "gama"
version = "0.1.0"
description = "Game analytics: turn RAM dumps of a running DOS game into a queryable SQLite dataset"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
gama = "gama.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.20"]
build-backend = "uv_build"
